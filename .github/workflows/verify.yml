name: Verify audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline reproduction (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.10'}
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: windows-2025, python: '3.12'}
          - {os: ubuntu-24.04, python: '3.14'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify packaged file checksums
        run: python scripts/verify_manifest.py
      - name: Verify headers and reproduce all rows
        run: python reproduce.py
      - name: Cross-check the stated rule and context from raw bytes
        run: python scripts/check_direct.py
      - name: Test selection and threshold edge cases
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            build/summary.json
            build/direct_check.json
            build/*.csv
            build/events.json
            build/diagnostics.json
            build/example_263_265.json
            build/followup/
            build/disputed_labels/
          if-no-files-found: error

  package:
    name: Verified portable research archive
    needs: [offline, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build complete archive from the exact verified Git tree
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            version="1.0.0-dev.${GITHUB_SHA}"
          fi
          python scripts/build_release.py --version "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Patoshi-Timing-Audit-package
          path: build/release/
          if-no-files-found: error

  release:
    name: Publish and verify the tagged release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: [offline, native, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build, verify and publish the immutable assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          python scripts/build_release.py --version "$version"
          archive="Patoshi_Timing_Audit_v${version}.zip"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              "build/release/$archive" build/release/SHA256SUMS.txt build/release/release.json \
              --verify-tag --draft --title "Patoshi Timing Audit $RELEASE_TAG" \
              --notes-file RELEASE_NOTES.md
          fi
          gh release download "$RELEASE_TAG" --dir build/published-assets \
            --pattern "$archive" --pattern SHA256SUMS.txt --pattern release.json
          python - <<'PY'
          import json
          from pathlib import Path
          built = Path('build/release')
          published = Path('build/published-assets')
          report = json.loads((built / 'release.json').read_text())
          for name in (report['archive'], 'SHA256SUMS.txt', 'release.json'):
              if (built / name).read_bytes() != (published / name).read_bytes():
                  raise ValueError('Published release asset differs: ' + name)
          print('All published assets match the verified commit byte for byte.')
          PY
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          gh release view "$RELEASE_TAG" --json url,tagName,isDraft,isPrerelease,assets

  native:
    name: Native PHP and fresh source provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Require PHP 8 CLI
        shell: bash
        run: |
          php -n -v
          php -n -r 'exit(PHP_MAJOR_VERSION === 8 ? 0 : 1);'
      - name: Fetch and verify the original source
        run: python scripts/fetch_original_source.py build/original.php
      - name: Compare every frozen label with the pinned source
        run: python scripts/verify_source_labels.py --source build/original.php
      - name: Reproduce in actual PHP and compare every output byte
        run: python scripts/run_native.py --php php --source build/original.php
      - name: Exercise the same edge cases in actual PHP
        env:
          PATOSHI_TEST_PHP: php
          PATOSHI_TEST_SOURCE: ${{ github.workspace }}/build/original.php
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-and-provenance
          path: |
            build/summary.json
            build/native_verification.json
            build/source_label_verification.json
            build/native/*.csv
          if-no-files-found: error

  online-provenance:
    name: Optional fresh header acquisition
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Compare a fresh 4 MB prefix with frozen headers
        run: python scripts/verify_live_headers.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fresh-header-provenance
          path: build/live_header_verification.json
          if-no-files-found: error
